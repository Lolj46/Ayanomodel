
name: Build Ayanokoji Playermodel

on:
  workflow_dispatch:
  push:
    paths:
      - "ayanokoji_gmod_source_build.zip"
      - ".github/workflows/build-playermodel.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout model project
        uses: actions/checkout@v4

      - name: Checkout Source SDK
        uses: actions/checkout@v4
        with:
          repository: ValveSoftware/source-sdk-2013
          ref: c3ca7291626b60a32008774dd290671708babc20
          path: source-sdk-2013

      - name: Checkout studiomdl build kit
        uses: actions/checkout@v4
        with:
          repository: MSteam/studiomdl-linux
          ref: 5d22a9c5c398345e16b0deb4d8003495ef365cd6
          path: studiomdl-linux

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Prepare model files
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/model"
          unzip -q ayanokoji_gmod_source_build.zip -d "$RUNNER_TEMP/model"

          echo "=== Extracted files ==="
          find "$RUNNER_TEMP/model" -maxdepth 5 -type f

          test -d "$RUNNER_TEMP/model/ayanokoji_playermodel"
          test -d "$RUNNER_TEMP/model/ayanokoji_playermodel/modelsrc"
          test -f "$RUNNER_TEMP/model/ayanokoji_playermodel/modelsrc/ayanokoji.qc"

          echo "MODEL=$RUNNER_TEMP/model/ayanokoji_playermodel" >> "$GITHUB_ENV"

      - name: Prepare Source SDK
        run: |
          set -euo pipefail

          SDK="$GITHUB_WORKSPACE/source-sdk-2013/sp"

          test -d "$SDK/src"
          test -f "$SDK/src/public/studio.h"

          echo "SDK=$SDK" >> "$GITHUB_ENV"

      - name: Prepare container
        run: |
          set -euo pipefail

          IMAGE="registry.gitlab.steamos.cloud/steamrt/scout/sdk"

          podman pull "$IMAGE:latest"
          podman tag "$IMAGE:latest" "$IMAGE"
          podman image inspect "$IMAGE"

      - name: Build studiomdl
        run: |
          set -euo pipefail

          cd studiomdl-linux

          ./scripts/check_deps.sh "$SDK"
          ./scripts/apply_to_sdk.sh "$SDK"
          ./scripts/build.sh "$SDK"

          test -x "$SDK/game/bin/studiomdl"

          echo "STUDIOMDL=$SDK/game/bin/studiomdl" >> "$GITHUB_ENV"

      - name: Prepare Steam tool configuration
        run: |
          set -euo pipefail

          CONFIG="$SDK/game/bin/config"
          mkdir -p "$CONFIG"

          cat > "$CONFIG/SteamAppData.vdf" <<'EOF'
          "SteamAppData"
          {
              "RememberPassword" "0"
              "AutoLoginUser" "CSM"
              "CSM"
              {
                  "User" "CSM"
                  "AccountCreated" "1"
                  "ShowNotifyTrayHintDialog" "0"
              }
          }
          EOF

          echo "=== Compiler ==="
          ls -l "$STUDIOMDL"

          echo "=== SteamAppData location ==="
          ls -l "$CONFIG/SteamAppData.vdf"

          echo "=== SteamAppData content ==="
          cat "$CONFIG/SteamAppData.vdf"

      - name: Prepare game directory
        run: |
          set -euo pipefail

          GAME="$RUNNER_TEMP/game"

          mkdir -p "$GAME/models"
          mkdir -p "$GAME/materials"

          cat > "$GAME/gameinfo.txt" <<'EOF'
          "GameInfo"
          {
              game "Ayanokoji Model Build"
              title "Ayanokoji Model Build"
              FileSystem
              {
                  SteamAppId 243750
                  SearchPaths
                  {
                      Game |gameinfo_path|.
                      Game hl2
                  }
              }
          }
          EOF

          test -f "$GAME/gameinfo.txt"

          if [ -d "$MODEL/materials" ]; then
            cp -a "$MODEL/materials/." "$GAME/materials/"
          fi

          echo "GAME=$GAME" >> "$GITHUB_ENV"

      - name: Inspect model sources
        run: |
          set -euo pipefail

          echo "=== QC files ==="
          find "$MODEL" -type f -iname "*.qc"

          echo "=== SMD files ==="
          find "$MODEL" -type f -iname "*.smd"

          echo "=== Textures ==="
          find "$MODEL" -type f \( -iname "*.png" -o -iname "*.vtf" \)

          test -f "$MODEL/modelsrc/ayanokoji.qc"

      - name: Compile model
        run: |
          set -euo pipefail

          cd "$MODEL/modelsrc"

          "$STUDIOMDL" \
            -game "$GAME" \
            -nop4 \
            ayanokoji.qc \
            2>&1 | tee "$RUNNER_TEMP/compile.log"

          echo "=== Compiled model files ==="
          find "$GAME/models" -type f

          test -n "$(find "$GAME/models" -type f -name '*.mdl' -print -quit)"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayanokoji-build-logs
          path: ${{ runner.temp }}/compile.log
          if-no-files-found: ignore

      - name: Upload compiled model
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ayanokoji-compiled-model
          path: ${{ runner.temp }}/game/
          if-no-files-found: error
