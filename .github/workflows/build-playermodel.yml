name: Build Ayanokoji Playermodel

on:
  workflow_dispatch:
  push:
    paths:
      - "ayanokoji_gmod_source_build.zip"
      - ".github/workflows/build-playermodel.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout model project
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip jq

      - name: Extract model sources
        run: |
          set -euo pipefail

          test -f ayanokoji_gmod_source_build.zip
          mkdir -p "$RUNNER_TEMP/model"
          unzip -q ayanokoji_gmod_source_build.zip -d "$RUNNER_TEMP/model"

          echo "=== Archive contents ==="
          find "$RUNNER_TEMP/model" -maxdepth 6 -type f | sort

          QC="$(find "$RUNNER_TEMP/model" -type f -iname 'ayanokoji.qc' -print -quit)"
          test -n "$QC"

          MODEL_DIR="$(dirname "$(dirname "$QC")")"
          echo "QC=$QC" >> "$GITHUB_ENV"
          echo "MODEL=$MODEL_DIR" >> "$GITHUB_ENV"

          echo "Selected QC: $QC"
          echo "Model directory: $MODEL_DIR"

          echo "=== SMD sources ==="
          find "$MODEL_DIR" -type f -iname '*.smd' -print
          test -n "$(find "$MODEL_DIR" -type f -iname '*.smd' -print -quit)"

      - name: Download PulseModel Linux release
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/ToppiOfficial/PulseModel/releases/latest"
          curl -fsSL "$API" -o "$RUNNER_TEMP/pulse-release.json"

          echo "=== Latest PulseModel release ==="
          jq -r '"Tag: " + .tag_name, (.assets[] | "Asset: " + .name)' "$RUNNER_TEMP/pulse-release.json"

          URL="$(jq -r '.assets[] | select((.name | ascii_downcase | contains("linux")) and (.name | ascii_downcase | endswith(".zip"))) | .browser_download_url' "$RUNNER_TEMP/pulse-release.json" | head -n 1)"
          if [ -z "$URL" ]; then
            echo "Could not identify the Linux ZIP asset."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/pulsemodel"
          curl -fL "$URL" -o "$RUNNER_TEMP/pulsemodel.zip"
          unzip -q "$RUNNER_TEMP/pulsemodel.zip" -d "$RUNNER_TEMP/pulsemodel"

          COMPILER="$(find "$RUNNER_TEMP/pulsemodel" -type f -name mdlcompiler -print -quit)"
          test -n "$COMPILER"
          chmod +x "$COMPILER"

          echo "COMPILER=$COMPILER" >> "$GITHUB_ENV"
          file "$COMPILER"
          ldd "$COMPILER" || true

      - name: Prepare game output
        run: |
          set -euo pipefail

          GAME="$RUNNER_TEMP/game"
          mkdir -p "$GAME/models" "$GAME/materials"

          if [ -d "$MODEL/materials" ]; then
            cp -a "$MODEL/materials/." "$GAME/materials/"
          fi

          echo "GAME=$GAME" >> "$GITHUB_ENV"

      - name: Verify QC and model sources
        run: |
          set -euo pipefail

          echo "=== QC ==="
          sed -n '1,240p' "$QC"

          echo "=== SMD headers ==="
          while IFS= read -r f; do
            echo "--- $f"
            sed -n '1,18p' "$f"
          done < <(find "$MODEL" -type f -iname '*.smd' | sort)

          echo "=== PulseModel commands ==="
          "$COMPILER" -dumpcommands | tee "$RUNNER_TEMP/pulse-commands.txt"

          echo "=== QC verification ==="
          "$COMPILER" "$QC" -game "$GAME" -vtxformat 0 -verify 2>&1 | tee "$RUNNER_TEMP/verify.log"

      - name: Compile GMod model
        run: |
          set -euo pipefail

          "$COMPILER" "$QC" -game "$GAME" -vtxformat 0 2>&1 | tee "$RUNNER_TEMP/compile.log"

          echo "=== Generated files ==="
          find "$GAME" -type f | sort

          test -n "$(find "$GAME/models" -type f -name '*.mdl' -print -quit)"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayanokoji-pulsemodel-logs
          path: |
            ${{ runner.temp }}/verify.log
            ${{ runner.temp }}/compile.log
            ${{ runner.temp }}/pulse-commands.txt
          if-no-files-found: ignore

      - name: Upload compiled model
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ayanokoji-compiled-model
          path: ${{ runner.temp }}/game/
          if-no-files-found: error
